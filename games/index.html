m":"Context window","def":"Объём текста, который LLM видит одновременно. В 2026 достигает миллионов токенов (Gemini 2.0)."},{"id":"d31","term":"Conversational search","def":"Многошаговый диалог с поисковиком с сохранением контекста. ChatGPT Search, Perplexity задают уточняющие вопросы."},{"id":"d32","term":"Core Web Vitals (CWV)","def":"Три главные метрики пользовательского опыта от Google: LCP + CLS + INP. Плохой CWV = более низкие позиции."},{"id":"d33","term":"Corpus","def":"Массив данных, на котором обучена LLM. Влияет на предпочтения модели в цитировании."},{"id":"d34","term":"Cosine Similarity","def":"Оценка (0–1) семантической близости двух текстов. >0.85 = одна статья; 0.75–0.85 = разные статьи в одном SILO; <0.65 = разные темы"},{"id":"d35","term":"Crawl Budget","def":"Сколько страниц Googlebot обходит за день. Крупные сайты с тонким/дублирующим контентом тратят бюджет впустую."},{"id":"d36","term":"Cross-sell","def":"Предложить дополнительную, отдельную услугу."},{"id":"d37","term":"CRP — Critical Rendering Path","def":"Шаги браузера до отображения контента. Скрипты в <head> блокируют этот путь."},{"id":"d39","term":"DOM — Document Object Model","def":"Структура страницы после выполнения JavaScript — то, что видит пользователь и браузер. Отличается от исходного HTML."},{"id":"d41","term":"EAV triplet","def":"Структура: сущность + атрибут + значение. Пример: «Perplexity — тип — ответный поисковик». Стандарт GEO-контента."},{"id":"d42","term":"Embedding","def":"Числовое представление текста или изображения. Используется в семантическом поиске и GEO."},{"id":"d43","term":"Entity","def":"Уникальный объект или понятие (человек, бренд, место, событие). Google оперирует миллиардами сущностей в Knowledge Graph."},{"id":"d46","term":"Experience signals","def":"Данные, подтверждающие, что автор действительно делал то, о чём пишет (фото процесса, даты, личные истории). Ключевой фактор E‑E‑A‑T."},{"id":"d47","term":"E‑E‑A‑T","def":"Критерии оценки качества контента. В 2026 критичны для попадания в цитаты AI Overviews."},{"id":"d48","term":"Fact density","def":"Количество проверяемых утверждений на единицу текста. Чем выше — тем охотнее ИИ цитирует."},{"id":"d49","term":"FCP — First Contentful Paint","def":"Момент когда первый контент (любой текст или изображение) появляется на экране."},{"id":"d50","term":"Featured snippet","def":"Блок с прямым ответом над всей выдачей. В 2026 вытесняется AI Overviews, но остаётся для простых фактологических запросов."},{"id":"d53","term":"Freshness signal","def":"Дата обновления контента. ИИ предпочитает цитировать актуальные источники, особенно по быстро меняющимся темам."},{"id":"d54","term":"Generative AI (GenAI)","def":"ИИ, создающий новый контент. В 2026 встроен во все поисковые системы."},{"id":"d55","term":"GEO","def":"Стратегия попадания в цитаты и ответы ИИ-поисковиков: Google AI Overviews, ChatGPT, Perplexity и др."},{"id":"d56","term":"GEO for voice","def":"Оптимизация контента под голосовые ответы ИИ-ассистентов (Siri, Alexa, Google Assistant с LLM). Требует коротких, чётких, разговорных формулировок."},{"id":"d58","term":"Grounding","def":"Привязка ответа ИИ к реальным источникам. Ключевой фактор доверия и цитирования в GEO."},{"id":"d59","term":"Hallucination","def":"Ложная информация от ИИ. В 2026 снизилась благодаря grounding, но не исчезла."},{"id":"d62","term":"INP — Interaction to Next Paint","def":"Скорость реакции страницы на клик, нажатие или ввод. Цель: менее 200 мс."},{"id":"d63","term":"Intent classification","def":"Определение типа намерения: информационный, навигационный, транзакционный или коммерческий."},{"id":"d64","term":"Internal linking","def":"Система ссылок внутри сайта. Помогает передавать вес и строить семантические кластеры."},{"id":"d65","term":"JavaScript rendering","def":"Контент, построенный через JavaScript после загрузки. Риск: Googlebot видит, но с задержкой от часов до недель."},{"id":"d66","term":"Knowledge Graph","def":"Живая база данных Google о сущностях и их связях. Питает панели знаний и AI Overviews."},{"id":"d67","term":"Knowledge Panel","def":"Информационный блок справа в поиске Google об известной сущности: бренде, персоне, месте."},{"id":"d68","term":"LCP — Largest Contentful Paint","def":"Время до загрузки основного контента (главное изображение / заголовок). Цель: до 2.5 секунд."},{"id":"d70","term":"LLM","def":"Модель, обученная на триллионах токенов (GPT‑5, Gemini 2.0, Claude 4). Основа генеративных поисковиков."},{"id":"d71","term":"LLM training data","def":"Данные, на которых обучена языковая модель. Если ваш контент попал туда — бренд закреплён в «памяти» модели."},{"id":"d72","term":"LLMO","def":"Синоним GEO. Акцент на том, чтобы контент хорошо индексировался и цитировался LLM."},{"id":"d75","term":"Multi-agent system","def":"Несколько ИИ-агентов, работающих вместе над сложной задачей. В поиске — для кросс-проверки фактов."},{"id":"d76","term":"Multimodal search","def":"Поиск, принимающий запросы в разных форматах: текст + изображение + голос одновременно."},{"id":"d77","term":"MUM","def":"Мультимодальная модель Google. Понимает текст, изображения, видео. Может решать сложные задачи в несколько шагов."},{"id":"d78","term":"Named Entity","def":"Объект реального мира с уникальным именем: человек, бренд, место, продукт. Google распознаёт их через Knowledge Graph."},{"id":"d79","term":"Neural matching","def":"ИИ-система Google, понимающая связь запроса со страницей на уровне смыслов, даже без точных слов."},{"id":"d80","term":"NLP","def":"Технология понимания человеческого языка машиной."},{"id":"d81","term":"Ontology","def":"Формальная система описания сущностей и их связей. Google использует онтологии для понимания предметных областей."},{"id":"d83","term":"PageSpeed Insights","def":"Бесплатный инструмент Google для измерения CWV — лабораторные данные (Lighthouse) и полевые данные (CrUX)."},{"id":"d84","term":"Passage ranking","def":"Способность Google находить и ранжировать конкретный фрагмент внутри страницы."},{"id":"d85","term":"Passage-level optimization","def":"Написание контента так, чтобы каждый абзац был самодостаточным и понятным без контекста остальной страницы."},{"id":"d87","term":"People Also Ask (PAA)","def":"Блок раскрывающихся вопросов. Важный источник семантических запросов и структуры контента."},{"id":"d88","term":"Pillar page","def":"Главная широкая страница по теме, вокруг которой выстраиваются кластерные материалы."},{"id":"d89","term":"Pilot project","def":"Небольшой пробный проект перед масштабированием."},{"id":"d90","term":"Prompt","def":"Запрос пользователя к ИИ-системе. GEO анализирует популярные промпты целевой аудитории."},{"id":"d91","term":"Prompt engineering","def":"Оптимизация запросов для получения нужного ответа от ИИ."},{"id":"d92","term":"Query expansion","def":"Автоматическое добавление поисковиком синонимов и связанных понятий к запросу пользователя."},{"id":"d93","term":"Query Fan-Out","def":"Разбивка одной темы на 10–50 под-запросов, покрывающих все намерения пользователей. Так ИИ-системы планируют ответы."},{"id":"d94","term":"RAG","def":"Технология: сначала поиск источников → потом генерация ответа на их основе. Стандарт для AI-поисковиков."},{"id":"d96","term":"Rendering","def":"Превращение HTML/CSS/JavaScript в то, что видит пользователь. Googlebot рендерит страницы отдельно от пользователей."},{"id":"d97","term":"Renewal","def":"Момент продления контракта на новый период."},{"id":"d98","term":"Response engine","def":"Поисковик, выдающий готовый ответ вместо списка ссылок. Perplexity, Arc Search, Bing Copilot."},{"id":"d99","term":"Retainer increase","def":"Увеличение фиксированного ежемесячного бюджета клиента."},{"id":"d100","term":"Reverse DNS Lookup","def":"Проверка принадлежит ли IP-адрес реальному Googlebot. Настоящий Googlebot разрешается в googlebot.com"},{"id":"d101","term":"Rich snippet","def":"Результат поиска с визуальными элементами: звёзды, цена, фото. Работают в выдаче и как источник для AI Overviews."},{"id":"d102","term":"robots.txt","def":"Файл, который говорит Googlebot какие страницы НЕ обходить. НЕ скрывает страницы от индекса Google."},{"id":"d105","term":"Schema markup","def":"Код (JSON-LD, Microdata) для передачи поисковикам смысла страницы. Критически важен для AI Overviews и голосовых ответов."},{"id":"d106","term":"Schema Markup (Schema-разметка)","def":"Код структурированных данных (JSON-LD), сообщающий Google что на странице. Включает расширенные сниппеты и ИИ-ответы."},{"id":"d107","term":"Scope expansion","def":"Расширение объёма или типа выполняемых работ."},{"id":"d108","term":"SDI Score","def":"Индекс семантического дрейфа: 60% Семантика + 30% Ссылки + 10% Вовлечённость. Измеряет насколько страница ушла от темы."},{"id":"d109","term":"Search intent","def":"Цель пользователя за запросом. В 2026 Google динамически меняет выдачу по ходу сессии."},{"id":"d110","term":"Self-sufficient passage","def":"Абзац, который ИИ может процитировать без потери смысла. Содержит субъект, атрибут и ценность."},{"id":"d111","term":"Semantic relevance","def":"Степень смысловой близости страницы к запросу. Важнее точного вхождения ключевого слова."},{"id":"d112","term":"Semantic search","def":"Поиск, понимающий смысл, контекст и намерение, а не только ключевые слова. Сейчас включает мультимодальность."},{"id":"d113","term":"SERP features","def":"Все нестандартные блоки поиска: карусели, карты, панели знаний, видео, PAA."},{"id":"d114","term":"Share of voice in AI","def":"Метрика: как часто ваш бренд цитируется в AI-поисковиках по сравнению с конкурентами. Стандарт отчётности 2026."},{"id":"d116","term":"SILO Structure","def":"Организация сайта в тематически связанные кластеры — каждый кластер остаётся в рамках своей темы"},{"id":"d118","term":"Sitemap (карта сайта)","def":"XML-файл со списком всех страниц, которые вы хотите чтобы Google обходил и индексировал. Отправляется через GSC."},{"id":"d120","term":"Structured data","def":"Общий термин для любой машиночитаемой разметки. Schema — основной словарь."},{"id":"d121","term":"Sub-intent","def":"Конкретная цель пользователя внутри более широкой темы. Одна страница = один под-интент."},{"id":"d122","term":"Synthetic data","def":"Данные, сгенерированные ИИ. В GEO: вопрос, цитирует ли ИИ живые источники или переработанные копии."},{"id":"d123","term":"TF-IDF","def":"Метрика важности слова: насколько часто оно встречается в тексте по сравнению со всем корпусом. Основа многих SEO-инструментов."},{"id":"d124","term":"Token","def":"Единица текста для LLM (~¾ слова). Ценообразование API идёт в токенах."},{"id":"d125","term":"Topic cluster","def":"Pillar-страница + связанные подстраницы. Основа семантической структуры сайта."},{"id":"d126","term":"Topical authority","def":"Статус эксперта по целой теме. Достигается глубиной контента и подтверждается цитированием в AI Overviews."},{"id":"d127","term":"Topical Drift (Content Drift)","def":"Когда страница начинает ранжироваться по темам, для которых не писалась — несоответствие контента реальным запросам"},{"id":"d128","term":"UMAP","def":"Визуальная карта семантических связей страниц. Изолированная страница на UMAP = структурный дрейф."},{"id":"d130","term":"Upsell","def":"Предложить клиенту более дорогой / расширенный вариант той же услуги."},{"id":"d131","term":"Value-based pricing","def":"Цена, основанная на прогнозируемой ценности / ROI, а не на потраченных часах."},{"id":"d132","term":"Vector database","def":"Хранилище для поиска по эмбеддингам. Основа архитектуры RAG."},{"id":"d133","term":"Vector search","def":"Поиск по смысловой близости: слова → векторы → сравнение расстояний между понятиями."},{"id":"d134","term":"Voice search optimization","def":"Адаптация контента под разговорные запросы, длинные вопросы и локальные интенты. В 2026 голосовой поиск — ~35% мобильных запросов."},{"id":"d135","term":"Warm lead","def":"Клиент, который уже морально готов купить — уже проявлял интерес."},{"id":"d136","term":"Zero-click search","def":"Пользователь получает ответ в AI Overviews и не переходит на сайт. ~40% запросов в 2026."}],"build":[{"en":"Feel free to jump in with questions.","ru":"Не стесняйтесь задавать вопросы."},{"en":"I'm open to suggestions here.","ru":"Я открыт для предложений по этому поводу."},{"en":"That about covers everything.","ru":"Это покрывает всё."},{"en":"Let me ping you about that later.","ru":"Я напишу тебе об этом позже."},{"en":"I'll keep you in the loop.","ru":"Я буду держать тебя в курсе."},{"en":"That's on my radar.","ru":"Это у меня на радаре."},{"en":"Let's circle back to this.","ru":"Давайте вернёмся к этому позже."},{"en":"That's a quick win.","ru":"Это быстрая победа."},{"en":"We're on the right track.","ru":"Мы на правильном пути."},{"en":"The numbers are trending upward / downward.","ru":"Цифры имеют восходящий / нисходящий тренд."},{"en":"The metrics have plateaued.","ru":"Метрики вышли на плато."},{"en":"Crawl errors <span class='ru-sub'>[крол эрэрз]<\/span>","ru":"ошибки обхода"},{"en":"Indexing rate <span class='ru-sub'>[индэксин рэйт]<\/span>","ru":"скорость индексации"},{"en":"Core Web Vitals","ru":"основные веб-показатели"},{"en":"LCP (Largest Contentful Paint)","ru":"загрузка крупнейшего контента"},{"en":"TTFB (Time to First Byte)","ru":"время до первого байта"},{"en":"Progressive Web App","ru":"прогрессивное веб-приложение"},{"en":"Meta tags optimization","ru":"оптимизация мета-тегов"},{"en":"Content gap analysis","ru":"анализ пробелов в контенте"},{"en":"Click-through rate (CTR)","ru":"рейтинг кликов"},{"en":"Mobile conversion rate","ru":"конверсия с мобильных"},{"en":"Local business schema","ru":"схема для локального бизнеса"},{"en":"Google My Business","ru":"Google Мой бизнес"},{"en":"Product page schema","ru":"схема для товарных страниц"},{"en":"I'm on it.","ru":"Я на этом (займусь этим)."},{"en":"Got it, thanks!","ru":"Понял, спасибо!"},{"en":"Works for me.","ru":"Меня устраивает."},{"en":"Perfect, let's do it.","ru":"Отлично, давайте сдела 's the word… the thing that…","ru":"Как это называется… та штука, которая…"},{"en":"You know, the…","ru":"Ну знаете, это…"},{"en":"It's like… but for SEO","ru":"Это как… но для SEO"},{"en":"How can I put it…","ru":"Как бы это сказать…"},{"en":"I mean…","ru":"Я имею в виду…"}]},{"title":"Когда нужно успокоить клиента","phrases":[{"en":"I totally get it","ru":"Я полностью понимаю"},{"en":"I hear you","ru":"Я вас слышу"},{"en":"That makes sense","ru":"Это логично"},{"en":"I understand your concern","ru":"Я понимаю вашу озабоченность"},{"en":"Let me explain what's happening","ru":"Позвольте объяснить, что происходит"},{"en":"Here's what we can do","ru":"Вот что мы можем сделать"},{"en":"Don't worry","ru":"Не волнуйтесь"},{"en":"This is actually normal","ru":"Это на самом деле нормально"}]},{"title":"Когда нужно выиграть время","phrases":[{"en":"Let me pull up the data","ru":"Дайте я открою данные"},{"en":"Give me one second","ru":"Дайте секунду"},{"en":"I need to check something first","ru":"Мне нужно сначала что-то проверить"},{"en":"Can I get back to you on that?","ru":"Могу я вернуться к вам по этому вопросу?"},{"en":"Let me look into this","ru":"Дайте я разберусь с этим"}]},{"title":"Когда объясняешь сложное","phrases":[{"en":"Think of it like this…","ru":"Представьте это так…"},{"en":"In simple terms…","ru":"Простыми словами…"},{"en":"Here's what this means…","ru":"Вот что это означает…"},{"en":"The bottom line is…","ru":"Суть в том…"},{"en":"What this means for you is…","ru":"Что это значит для вас…"},{"en":"To put it simply…","ru":"Говоря простыми словами…"}]},{"title":"Когда нужно дать негативную информацию","phrases":[{"en":"Here's the situation…","ru":"Вот ситуация…"},{"en":"I won't sugarcoat it…","ru":"Я не буду приукрашивать…"},{"en":"To be honest…","ru":"Если честно…"},{"en":"The reality is…","ru":"Реальность такова…"},{"en":"Unfortunately…","ru":"К сожалению…"},{"en":"The challenge here is…","ru":"Проблема здесь в том…"}]},{"title":"Когда продаёшь свою идею","phrases":[{"en":"Here's what I'm thinking…","ru":"Вот что я думаю…"},{"en":"The way I see it…","ru":"Как я это вижу…"},{"en":"This would help us because…","ru":"Это поможет нам, потому что…"},{"en":"If we do this, you'll see…","ru":"Если мы сделаем это, вы увидите…"},{"en":"The benefit here is…","ru":"Выгода здесь в том…"}]},{"title":"Универсальные связки","phrases":[{"en":"So…","ru":"Итак…"},{"en":"Actually — by the way…","ru":"На самом деле…"},{"en":"Basically…","ru":"В основном…"},{"en":"The thing is…","ru":"Дело в том…"},{"en":"You see…","ru":"Видите ли…"},{"en":"Look…","ru":"Смотрите…"},{"en":"Listen…","ru":"Послушайте…"}]}],"6":[{"title":"GEO — Generative Engine Optimization","phrases":[{"en":"We're optimizing for AI Overviews now.","ru":"Мы сейчас оптимизируем под AI Overviews."},{"en":"Our content is GEO-ready.","ru":"Наш контент готов для GEO."},{"en":"We're targeting LLMs, not just Google.","ru":"Мы таргетируемся на LLM, не только на Google."}]},{"title":"Semantic SEO","phrases":[{"en":"We work with entities, not just keywords.","ru":"Мы работаем с сущностями, а не просто ключевыми словами."},{"en":"We're building topical authority.","ru":"Мы строим тематический авторитет."},{"en":"Our strategy covers the entire knowledge graph.","ru":"Наша стратегия покрывает весь граф знаний."}]},{"title":"Entity-Based SEO","phrases":[{"en":"Entity clustering","ru":"кластеризация сущностей"},{"en":"Semantic relevance","ru":"семантическая релевантность"},{"en":"Cosine similarity","ru":"косинусная схожесть"},{"en":"Knowledge Graph","ru":"граф знаний"},{"en":"Topical coverage","ru":"тематическое покрытие"}]},{"title":"AI & Voice Search Optimization","phrases":[{"en":"Voice search ready","ru":"готово для голосового поиска"},{"en":"Featured snippets","ru":"избранные сниппеты"},{"en":"AI-generated answers","ru":"ответы, сгенерированные AI"},{"en":"Conversational queries","ru":"разговорные запросы"}]},{"title":"Вопросы, которые может задать клиент","phrases":[{"en":"What is Generative Engine Optimization (GEO) and how is it different from traditional SEO?","ru":""},{"en":"Why is GEO so important for modern digital marketing?","ru":""},{"en":"How can GEO help my business improve visibility in search engines and get more traffic?","ru":""},{"en":"Which specific AI systems and answer engines does GEO target, and why is this important?","ru":""},{"en":"How does GEO work, and how can we measure the success of our GEO efforts?","ru":""},{"en":"What types of content and strategies are most effective for GEO?","ru":""},{"en":"How can we ensure our content is cited and used as a source in AI systems and answer engines?","ru":""},{"en":"How will GEO impact our existing SEO strategy, and how do we integrate it smoothly?","ru":""},{"en":"What tools and methods can we use to track and analyze our GEO progress?","ru":""},{"en":"How can we ensure our GEO strategy aligns with Google and Bing's guidelines?","ru":""},{"en":"How can we adapt our GEO strategy for different languages and regions?","ru":""},{"en":"What challenges and risks might arise when implementing GEO, and how do we overcome them?","ru":""},{"en":"How can we study competitors' successes in GEO and apply that to our own strategy?","ru":""},{"en":"How can we ensure our GEO strategy is future-proof and resilient to change?","ru":""},{"en":"What is the main goal of Generative Engine Optimization (GEO)?","ru":""},{"en":"How does GEO differ from traditional SEO in terms of content structure?","ru":""},{"en":"What role does semantic analysis play in GEO?","ru":""},{"en":"How do generative search engines evaluate the authority of a website?","ru":""},{"en":"What are the key factors that influence a website's visibility in AI-driven search results?","ru":""},{"en":"What are the best practices for creating content optimized for GEO?","ru":""},{"en":"How can we monitor and measure the effectiveness of our GEO efforts?","ru":""},{"en":"How can we leverage GEO to improve our brand's reputation online?","ru":""}]}],"11":[{"title":"Мягкое уточнение","phrases":[{"en":"Actually (на самом деле / вообще-то)","ru":"It wasn't the update — it was the broken redirect."},{"en":"The thing is, (дело в том, что)","ru":"We can't fix this without dev support."},{"en":"That said, (тем не менее / при этом)","ru":"Traffic dropped. That said, conversions are fine."},{"en":"Here's the thing: (вот в чём дело)","ru":"Rankings are volatile right now."}]},{"title":"Причина и следствие","phrases":[{"en":"So basically, (так что по сути / короче говоря)","ru":"The page is too slow. So basically, users leave."},{"en":"Which means (that) (что означает / а значит)","ru":"We lost snippets, which means CTR dropped."},{"en":"That's why (вот почему / именно поэтому)","ru":"Robots.txt blocked it. That's why it's not indexed."},{"en":"As a result, (в результате)","ru":"We fixed 404s. As a result, crawlability improved."}]},{"title":"Добавление мысли","phrases":[{"en":"Plus, (плюс к этому / ещё)","ru":"We fixed titles. Plus, we improved internal linking."},{"en":"On top of that, (вдобавок к этому / мало того)","ru":"The site is slow. On top of that, it's not mobile-friendly."},{"en":"Also, (также / ещё)","ru":"We also need to check the page experience report."}]},{"title":"Пояснение","phrases":[{"en":"I mean, (я имею в виду / то есть)","ru":"CTR dropped — I mean, fewer people click on us."},{"en":"As in, (то есть / иными словами)","ru":"It's a soft 404, as in, the page looks empty to Google."},{"en":"To be clear, (чтобы было понятно / если говорить прямо)","ru":"We're not losing traffic — we're just seeing a seasonal dip."}]},{"title":"Мнение","phrases":[{"en":"To be honest, (честно говоря)","ru":"I didn't expect results this fast."},{"en":"Honestly, (честно / по-честному)","ru":"I think we should wait for the next core update."},{"en":"My take is, (на мой взгляд / моё мнение такое)","ru":"The competitor's new content hit us."},{"en":"To be fair, (справедливости ради / надо признать)","ru":"The drop isn't our fault — it's an algo shift."}]},{"title":"Реакции","phrases":[{"en":"That makes sense. (логично / понятно / это понятно)","ru":"«We should focus on content first.» → «That makes sense.»"},{"en":"Fair enough. (резонно / ладно, согласен)","ru":"«We need more time for proper testing.» → «Fair enough.»"},{"en":"Got it. (понял / принял)","ru":"«Check the index status first.» → «Got it.»"},{"en":"No worries. (ничего страшного / всё нормально)","ru":"«Sorry for the delay.» → «No worries.»"},{"en":"It depends. (зависит от ситуации / смотря как)","ru":"«Will we hit page 1?» → «It depends on the competition.»"}]},{"title":"Переходы","phrases":[{"en":"By the way, (кстати / между прочим)","ru":"Did we check the page experience report?"},{"en":"Speaking of which, (кстати об этом / раз уж зашла речь)","ru":"Speaking of backlinks, we got a new one from Forbes."},{"en":"As for... (что касается... / по поводу...)","ru":"As for your question about the budget, I suggest we move it to content."},{"en":"Anyway, (в любом случае / ладно, возвращаясь к теме)","ru":"Let's get back to the audit results."}]},{"title":"Заполнители пауз","phrases":[{"en":"You know, (ну, ты понимаешь / как бы)","ru":"Rankings are, you know, a bit unstable right now."},{"en":"How do I put it? (как бы это сказать? / как это выразить?)","ru":"The client's reaction was... how do I put it? Emotional."},{"en":"For what it's worth, (на мой взгляд / если это что-то значит)","ru":"I think the site structure is okay."},{"en":"At the end of the day, (в конечном счёте / если по-честному)","ru":"The user experience matters most."}]}],"14":[{"title":"A. Опираясь на результат (leveraging results)","phrases":[{"en":"Since we're already seeing strong results with X, this might be a good time to look at Y.","ru":"Раз мы уже видим сильные результаты по X, возможно, сейчас хороший момент посмотреть на Y."},{"en":"Given the growth we're seeing in organic traffic, have you thought about expanding into content marketing уп к GSC до среды?"},{"en":"&ldquo;Could your developer implement the redirect fixes by next Wednesday?&rdquo;","ru":"Мог бы ваш разработчик внедрить исправления редиректов до следующей среды?"},{"en":"&ldquo;Once we have access, we can start right away.&rdquo;","ru":"Как только получим доступ, сразу начнём."}]},{"title":"C. Задержка и сроки эффекта","phrases":[{"en":"&ldquo;Quick heads-up: we&rsquo;re running a little behind on the audit.&rdquo;","ru":"Небольшое предупреждение: мы немного отстаём по аудиту."},{"en":"&ldquo;The delay is due to a failed crawl export. The new ETA is Tuesday.&rdquo;","ru":"Задержка из-за сбоя выгрузки краула. Новая ожидаемая дата — вторник."},{"en":"&ldquo;Changes can take a few weeks to show up in Search Console, so we&rsquo;ll re-check on the 15th.&rdquo;","ru":"Изменения могут отобразиться в Search Console только через несколько недель, поэтому перепроверим 15-го."}]},{"title":"D. Вежливое напоминание","phrases":[{"en":"&ldquo;Just a gentle reminder about the access we requested last week.&rdquo;","ru":"Мягкое напоминание о доступе, который мы запрашивали на прошлой неделе."},{"en":"&ldquo;Without it, we won&rsquo;t be able to start the next stage on time.&rdquo;","ru":"Без него мы не сможем вовремя начать следующий этап."},{"en":"&ldquo;If it&rsquo;s easier, we can go through it on a quick call.&rdquo;","ru":"Если так удобнее, можем разобрать это на коротком звонке."}]},{"title":"E. «Это вне объёма»","phrases":[{"en":"&ldquo;That&rsquo;s a great idea, but it&rsquo;s outside the current scope.&rdquo;","ru":"Отличная идея, но она вне текущего объёма."},{"en":"&ldquo;I can send a quick estimate if you&rsquo;d like to add it.&rdquo;","ru":"Могу прислать быструю оценку, если захотите добавить."},{"en":"&ldquo;Let&rsquo;s keep the current plan on track and revisit this next month.&rdquo;","ru":"Давайте выдержим текущий план и вернёмся к этому в следующем месяце."}]}]}}</script>
