d post","ru":"спонсорская публикация"},{"id":"p532","term":"Spreadsheet","ru":"электронная таблица"},{"id":"p533","term":"Sprint","ru":"спринт"},{"id":"p534","term":"SSL certificate","ru":"SSL-сертификат"},{"id":"p535","term":"Staging site","ru":"тестовая версия сайта"},{"id":"p536","term":"Stakeholder","ru":"заинтересованная сторона"},{"id":"p537","term":"Statement of work (SOW)","ru":"техническое задание на работы (SOW)"},{"id":"p538","term":"Status update","ru":"обновление статуса"},{"id":"p539","term":"Structured content","ru":"структурированный контент"},{"id":"p540","term":"Structured data","ru":"структурированные данные"},{"id":"p541","term":"Sub-intent","ru":"под-интент"},{"id":"p542","term":"Subdirectory","ru":"подпапка"},{"id":"p543","term":"Subdomain","ru":"поддомен"},{"id":"p544","term":"Synthetic data","ru":"синтетические данные"},{"id":"p545","term":"Table of contents","ru":"оглавление"},{"id":"p546","term":"Technical SEO","ru":"технический SEO"},{"id":"p547","term":"Testimonial","ru":"отзыв клиента"},{"id":"p549","term":"Thin content","ru":"тонкий контент"},{"id":"p550","term":"Time to First Byte (TTFB)","ru":"время до первого байта"},{"id":"p551","term":"Title tag","ru":"тег title"},{"id":"p552","term":"Token","ru":"токен"},{"id":"p553","term":"Top stories","ru":"блок «Главные новости»"},{"id":"p554","term":"Topic cluster","ru":"тематический кластер"},{"id":"p555","term":"Topical authority","ru":"тематический авторитет"},{"id":"p557","term":"Topical map","ru":"тематическая карта"},{"id":"p558","term":"Topical relevance","ru":"тематическая релевантность"},{"id":"p559","term":"Touchpoint","ru":"точка контакта"},{"id":"p560","term":"Toxic link","ru":"токсичная ссылка"},{"id":"p561","term":"Trailing slash","ru":"косая черта в конце URL"},{"id":"p562","term":"Training data","ru":"обучающие данные"},{"id":"p563","term":"Transactional intent","ru":"транзакционный интент"},{"id":"p564","term":"Transcreation","ru":"транскреация"},{"id":"p565","term":"Trend","ru":"тренд"},{"id":"p567","term":"Turnaround time","ru":"срок выполнения"},{"id":"p568","term":"UMAP","ru":"ЮМАП-карта"},{"id":"p570","term":"Unlinked mention","ru":"упоминание без ссылки"},{"id":"p572","term":"Upselling","ru":"допродажа более дорогого"},{"id":"p573","term":"URL Inspection tool","ru":"инструмент проверки URL"},{"id":"p574","term":"URL parameter","ru":"URL-параметр"},{"id":"p576","term":"URL structure","ru":"структура URL"},{"id":"p577","term":"User-generated content (UGC)","ru":"пользовательский контент (UGC)"},{"id":"p578","term":"UTM parameters","ru":"UTM-метки"},{"id":"p579","term":"Value proposition","ru":"ценностное предложение"},{"id":"p581","term":"Vanity metric","ru":"метрика тщеславия"},{"id":"p582","term":"Vector database","ru":"векторная база данных"},{"id":"p583","term":"Vector search","ru":"векторный поиск"},{"id":"p584","term":"Video carousel","ru":"видеокарусель"},{"id":"p585","term":"Voice search optimization","ru":"оптимизация под голосовой поиск"},{"id":"p588","term":"Web directory","ru":"веб-каталог"},{"id":"p591","term":"Whitepaper","ru":"белая книга (whitepaper)"},{"id":"p594","term":"X-Robots-Tag","ru":"заголовок X-Robots-Tag"},{"id":"p595","term":"XML sitemap","ru":"XML-карта сайта"},{"id":"p596","term":"Year-over-year (YoY)","ru":"год к году (YoY)"},{"id":"p598","term":"Zero-click search","ru":"нулевой клик"}],"defs":[{"id":"d0","term":"301 Redirect","def":"Постоянный редирект — говорит Google и пользователям что страница переехала. Передаёт большую часть ссылочного веса."},{"id":"d9","term":"ABC Framework","def":"A = Анкоры (текст входящих ссылок), B = Тело страницы (контент), C = Клики (реальные запросы из GSC). Дрейф = несоответствие между ними."},{"id":"d14","term":"Add-on service","def":"Дополнительная услуга сверх основного пакета."},{"id":"d15","term":"AEO","def":"Близкий к GEO термин: оптимизация под поисковики, дающие прямые ответы (Perplexity, ChatGPT Search)."},{"id":"d16","term":"Agentic AI","def":"ИИ, способный самостоятельно выполнять цепочки действий (забронировать, купить, сравнить) без участия человека."},{"id":"d23","term":"AI Overview","def":"Блок со сгенерированным ответом, который Google показывает над всей органической выдачей. Главная цель GEO."},{"id":"d24","term":"AI Overview Ads","def":"Рекламные блоки, встроенные прямо в сгенерированный ИИ-ответ. Доступны в Google Ads с 2025 года."},{"id":"d26","term":"AI visibility","def":"Метрика: насколько часто бренд или сайт появляется в ответах ИИ-поисковиков."},{"id":"d31","term":"Anchor text","def":"Кликабельный текст ссылки. Сигнал для Google о теме страницы, на которую ведёт ссылка."},{"id":"d41","term":"async / defer","def":"Атрибуты HTML, позволяющие скриптам загружаться без блокировки. async = независимый; defer = запускается после разбора HTML."},{"id":"d44","term":"Authoritative content","def":"Контент с фактами, экспертизой и ссылками на источники. Приоритет для цитирования ИИ."},{"id":"d54","term":"Basic Auth","def":"Парольная защита на уровне сервера — полностью блокирует Googlebot. Используется для тестовых сайтов."},{"id":"d57","term":"BERT","def":"Модель Google, понимающая контекст слова в предложении. Фундамент семантического поиска."},{"id":"d63","term":"Brand mention","def":"Имя бренда в ответе ИИ. Даже без ссылки — сигнал видимости."},{"id":"d73","term":"Bundle","def":"Пакет из нескольких услуг, продаваемых вместе, обычно со скидкой."},{"id":"d76","term":"Canonical tag","def":"HTML-тег, указывающий поисковику основную версию страницы при наличии дублей."},{"id":"d77","term":"Canonical Tag (канонический тег)","def":"HTML-тег, указывающий на предпочтительную версию страницы. Предотвращает проблемы с дублирующим контентом."},{"id":"d88","term":"Chunking","def":"Деление контента на логические фрагменты для удобного цитирования ИИ."},{"id":"d90","term":"Citability","def":"Способность контента быть процитированным ИИ. Определяется точностью, фактурой и структурой."},{"id":"d91","term":"Citation","def":"Кликабельная ссылка на вашу страницу внутри ИИ-ответа — главный KPI GEO"},{"id":"d92","term":"Citation / Source","def":"Кликабельная ссылка на сайт в блоке AI Overview или ответе ChatGPT. Основной KPI в GEO."},{"id":"d97","term":"CLS — Cumulative Layout Shift","def":"Насколько сильно контент страницы смещается при загрузке. Цель: менее 0.1."},{"id":"d99","term":"Co-occurrence","def":"Частота, с которой два слова или понятия появляются рядом. Сигнал семантической связи для Google."},{"id":"d113","term":"Content origin verification","def":"Подтверждение, что контент создан человеком-экспертом, а не ИИ. Влияет на цитирование."},{"id":"d117","term":"Context window","def":"Объём текста, который LLM видит одновременно. В 2026 достигает миллионов токенов (Gemini 2.0)."},{"id":"d119","term":"Conversational search","def":"Многошаговый диалог с поисковиком с сохранением контекста. ChatGPT Search, Perplexity задают уточняющие вопросы."},{"id":"d124","term":"Core Web Vitals (CWV)","def":"Три главные метрики пользовательского опыта от Google: LCP + CLS + INP. Плохой CWV = более низкие позиции."},{"id":"d127","term":"Corpus","def":"Массив данных, на котором обучена LLM. Влияет на предпочтения модели в цитировании."},{"id":"d128","term":"Cosine Similarity","def":"Оценка (0–1) семантической близости двух текстов. >0.85 = одна статья; 0.75–0.85 = разные статьи в одном SILO; <0.65 = разные темы"},{"id":"d130","term":"Crawl Budget","def":"Сколько страниц Googlebot обходит за день. Крупные сайты с тонким/дублирующим контентом тратят бюджет впустую."},{"id":"d137","term":"Cross-sell","def":"Предложить дополнительную, отдельную услугу."},{"id":"d139","term":"CRP — Critical Rendering Path","def":"Шаги браузера до отображения контента. Скрипты в <head> блокируют этот путь."},{"id":"d158","term":"DOM — Document Object Model","def":"Структура страницы после выполнения JavaScript — то, что видит пользователь и браузер. Отличается от исходного HTML."},{"id":"d166","term":"EAV triplet","def":"Структура: сущность + атрибут + значение. Пример: «Perplexity — тип — ответный поисковик». Стандарт GEO-контента."},{"id":"d168","term":"Embedding","def":"Числовое представление текста или изображения. Используется в семантическом поиске и GEO."},{"id":"d170","term":"Entity","def":"Уникальный объект или понятие (человек, бренд, место, событие). Google оперирует миллиардами сущностей в Knowledge Graph."},{"id":"d179","term":"Experience signals","def":"Данные, подтверждающие, что автор действительно делал то, о чём пишет (фото процесса, даты, личные истории). Ключевой фактор E‑E‑A‑T."},{"id":"d182","term":"E‑E‑A‑T","def":"Критерии оценки качества контента. В 2026 критичны для попадания в цитаты AI Overviews."},{"id":"d184","term":"Fact density","def":"Количество проверяемых утверждений на единицу текста. Чем выше — тем охотнее ИИ цитирует."},{"id":"d187","term":"FCP — First Contentful Paint","def":"Момент когда первый контент (любой текст или изображение) появляется на экране."},{"id":"d188","term":"Featured snippet","def":"Блок с прямым ответом над всей выдачей. В 2026 вытесняется AI Overviews, но остаётся для простых фактологических запросов."},{"id":"d195","term":"Freshness signal","def":"Дата обновления контента. ИИ предпочитает цитировать актуальные источники, особенно по быстро меняющимся темам."},{"id":"d198","term":"Generative AI (GenAI)","def":"ИИ, создающий новый контент. В 2026 встроен во все поисковые системы."},{"id":"d200","term":"GEO","def":"Стратегия попадания в цитаты и ответы ИИ-поисковиков: Google AI Overviews, ChatGPT, Perplexity и др."},{"id":"d201","term":"GEO for voice","def":"Оптимизация контента под голосовые ответы ИИ-ассистентов (Siri, Alexa, Google Assistant с LLM). Требует коротких, чётких, разговорных формулировок."},{"id":"d217","term":"Grounding","def":"Привязка ответа ИИ к реальным источникам. Ключевой фактор доверия и цитирования в GEO."},{"id":"d221","term":"Hallucination","def":"Ложная информация от ИИ. В 2026 снизилась благодаря grounding, но не исчезла."},{"id":"d254","term":"INP — Interaction to Next Paint","def":"Скорость реакции страницы на клик, нажатие или ввод. Цель: менее 200 мс."},{"id":"d255","term":"Intent classification","def":"Определение типа намерения: информационный, навигационный, транзакционный или коммерческий."},{"id":"d257","term":"Internal linking","def":"Система ссылок внутри сайта. Помогает передавать вес и строить семантические кластеры."},{"id":"d259","term":"JavaScript rendering","def":"Контент, построенный через JavaScript после загрузки. Риск: Googlebot видит, но с задержкой от часов до недель."},{"id":"d272","term":"Knowledge Graph","def":"Живая база данных Google о сущностях и их связях. Питает панели знаний и AI Overviews."},{"id":"d273","term":"Knowledge Panel","def":"Информационный блок справа в поиске Google об известной сущности: бренде, персоне, месте."},{"id":"d281","term":"LCP — Largest Contentful Paint","def":"Время до загрузки основного контента (главное изображение / заголовок). Цель: до 2.5 секунд."},{"id":"d303","term":"LLM","def":"Модель, обученная на триллионах токенов (GPT‑5, Gemini 2.0, Claude 4). Основа генеративных поисковиков."},{"id":"d304","term":"LLM training data","def":"Данные, на которых обучена языковая модель. Если ваш контент попал туда — бренд закреплён в «памяти» модели."},{"id":"d305","term":"LLMO","def":"Синоним GEO. Акцент на том, чтобы контент хорошо индексировался и цитировался LLM."},{"id":"d342","term":"Multi-agent system","def":"Несколько ИИ-агентов, работающих вместе над сложной задачей. В поиске — для кросс-проверки фактов."},{"id":"d344","term":"Multimodal search","def":"Поиск, принимающий запросы в разных форматах: текст + изображение + голос одновременно."},{"id":"d346","term":"MUM","def":"Мультимодальная модель Google. Понимает текст, изображения, видео. Может решать сложные задачи в несколько шагов."},{"id":"d348","term":"Named Entity","def":"Объект реального мира с уникальным именем: человек, бренд, место, продукт. Google распознаёт их через Knowledge Graph."},{"id":"d356","term":"Neural matching","def":"ИИ-система Google, понимающая связь запроса со страницей на уровне смыслов, даже без точных слов."},{"id":"d359","term":"NLP","def":"Технология понимания человеческого языка машиной."},{"id":"d366","term":"Ontology","def":"Формальная система описания сущностей и их связей. Google использует онтологии для понимания предметных областей."},{"id":"d377","term":"PageSpeed Insights","def":"Бесплатный инструмент Google для измерения CWV — лабораторные данные (Lighthouse) и полевые данные (CrUX)."},{"id":"d383","term":"Passage ranking","def":"Способность Google находить и ранжировать конкретный фрагмент внутри страницы."},{"id":"d384","term":"Passage-level optimization","def":"Написание контента так, чтобы каждый абзац был самодостаточным и понятным без контекста остальной страницы."},{"id":"d388","term":"People Also Ask (PAA)","def":"Блок раскрывающихся вопросов. Важный источник семантических запросов и структуры контента."},{"id":"d392","term":"Pillar page","def":"Главная широкая страница по теме, вокруг которой выстраиваются кластерные материалы."},{"id":"d393","term":"Pilot project","def":"Небольшой пробный проект перед масштабированием."},{"id":"d411","term":"Prompt","def":"Запрос пользователя к ИИ-системе. GEO анализирует популярные промпты целевой аудитории."},{"id":"d412","term":"Prompt engineering","def":"Оптимизация запросов для получения нужного ответа от ИИ."},{"id":"d422","term":"Query expansion","def":"Автоматическое добавление поисковиком синонимов и связанных понятий к запросу пользователя."},{"id":"d423","term":"Query Fan-Out","def":"Разбивка одной темы на 10–50 под-запросов, покрывающих все намерения пользователей. Так ИИ-системы планируют ответы."},{"id":"d426","term":"RAG","def":"Технология: сначала поиск источников → потом генерация ответа на их основе. Стандарт для AI-поисковиков."},{"id":"d449","term":"Rendering","def":"Превращение HTML/CSS/JavaScript в то, что видит пользователь. Googlebot рендерит страницы отдельно от пользователей."},{"id":"d450","term":"Renewal","def":"Момент продления контракта на новый период."},{"id":"d454","term":"Response engine","def":"Поисковик, выдающий готовый ответ вместо списка ссылок. Perplexity, Arc Search, Bing Copilot."},{"id":"d457","term":"Retainer increase","def":"Увеличение фиксированного ежемесячного бюджета клиента."},{"id":"d459","term":"Reverse DNS Lookup","def":"Проверка принадлежит ли IP-адрес реальному Googlebot. Настоящий Googlebot разрешается в googlebot.com"},{"id":"d465","term":"Rich snippet","def":"Результат поиска с визуальными элементами: звёзды, цена, фото. Работают в выдаче и как источник для AI Overviews."},{"id":"d469","term":"robots.txt","def":"Файл, который говорит Googlebot какие страницы НЕ обходить. НЕ скрывает страницы от индекса Google."},{"id":"d473","term":"Schema markup","def":"Код (JSON-LD, Microdata) для передачи поисковикам смысла страницы. Критически важен для AI Overviews и голосовых ответов."},{"id":"d474","term":"Schema Markup (Schema-разметка)","def":"Код структурированных данных (JSON-LD), сообщающий Google что на странице. Включает расширенные сниппеты и ИИ-ответы."},{"id":"d476","term":"Scope expansion","def":"Расширение объёма или типа выполняемых работ."},{"id":"d480","term":"SDI Score","def":"Индекс семантического дрейфа: 60% Семантика + 30% Ссылки + 10% Вовлечённость. Измеряет насколько страница ушла от темы."},{"id":"d485","term":"Search intent","def":"Цель пользователя за запросом. В 2026 Google динамически меняет выдачу по ходу сессии."},{"id":"d495","term":"Self-sufficient passage","def":"Абзац, который ИИ может процитировать без потери смысла. Содержит субъект, атрибут и ценность."},{"id":"d498","term":"Semantic relevance","def":"Степень смысловой близости страницы к запросу. Важнее точного вхождения ключевого слова."},{"id":"d499","term":"Semantic search","def":"Поиск, понимающий смысл, контекст и намерение, а не только ключевые слова. Сейчас включает мультимодальность."},{"id":"d504","term":"SERP features","def":"Все нестандартные блоки поиска: карусели, карты, панели знаний, видео, PAA."},{"id":"d510","term":"Share of voice in AI","def":"Метрика: как часто ваш бренд цитируется в AI-поисковиках по сравнению с конкурентами. Стандарт отчётности 2026."},{"id":"d514","term":"SILO Structure","def":"Организация сайта в тематически связанные кластеры — каждый кластер остаётся в рамках своей темы"},{"id":"d521","term":"Sitemap (карта сайта)","def":"XML-файл со списком всех страниц, которые вы хотите чтобы Google обходил и индексировал. Отправляется через GSC."},{"id":"d540","term":"Structured data","def":"Общий термин для любой машиночитаемой разметки. Schema — основной словарь."},{"id":"d541","term":"Sub-intent","def":"Конкретная цель пользователя внутри более широкой темы. Одна страница = один под-интент."},{"id":"d544","term":"Synthetic data","def":"Данные, сгенерированные ИИ. В GEO: вопрос, цитирует ли ИИ живые источники или переработанные копии."},{"id":"d548","term":"TF-IDF","def":"Метрика важности слова: насколько часто оно встречается в тексте по сравнению со всем корпусом. Основа многих SEO-инструментов."},{"id":"d552","term":"Token","def":"Единица текста для LLM (~¾ слова). Ценообразование API идёт в токенах."},{"id":"d554","term":"Topic cluster","def":"Pillar-страница + связанные подстраницы. Основа семантической структуры сайта."},{"id":"d555","term":"Topical authority","def":"Статус эксперта по целой теме. Достигается глубиной контента и подтверждается цитированием в AI Overviews."},{"id":"d556","term":"Topical Drift (Content Drift)","def":"Когда страница начинает ранжироваться по темам, для которых не писалась — несоответствие контента реальным запросам"},{"id":"d568","term":"UMAP","def":"Визуальная карта семантических связей страниц. Изолированная страница на UMAP = структурный дрейф."},{"id":"d571","term":"Upsell","def":"Предложить клиенту более дорогой / расширенный вариант той же услуги."},{"id":"d580","term":"Value-based pricing","def":"Цена, основанная на прогнозируемой ценности / ROI, а не на потраченных часах."},{"id":"d582","term":"Vector database","def":"Хранилище для поиска по эмбеддингам. Основа архитектуры RAG."},{"id":"d583","term":"Vector search","def":"Поиск по смысловой близости: слова → векторы → сравнение расстояний между понятиями."},{"id":"d585","term":"Voice search optimization","def":"Адаптация контента под разговорные запросы, длинные вопросы и локальные интенты. В 2026 голосовой поиск — ~35% мобильных запросов."},{"id":"d586","term":"Warm lead","def":"Клиент, который уже морально готов купить — уже проявлял интерес."},{"id":"d598","term":"Zero-click search","def":"Пользователь получает ответ в AI Overviews и не переходит на сайт. ~40% запросов в 2026."}],"build":[{"en":"Feel free to jump in with questions.","ru":"Не стесняйтесь задавать вопросы."},{"en":"I'm open to suggestions here.","ru":"Я открыт для предложений по этому поводу."},{"en":"That about covers everything.","ru":"Это покрывает всё."},{"en":"Let me ping you about that later.","ru":"Я напишу тебе об этом позже."},{"en":"I'll keep you in the loop.","ru":"Я буду держать тебя в курсе."},{"en":"That's on my radar.","ru":"Это у меня на радаре."},{"en":"Let's circle back to this.","ru":"Давайте вернёмся к этому позже."},{"en":"That's a quick win.","ru":"Это быстрая победа."},{"en":"We're on the right track.","ru":"Мы на правильном пути."},{"en":"The numbers are trending upward / downward.","ru":"Цифры имеют восходящий / нисходящий тренд."},{"en":"The metrics have plateaued.","ru":"Метрики вышли на плато."},{"en":"Crawl errors <span class='ru-sub'>[крол эрэрз]<\/span>","ru":"ошибки обхода"},{"en":"Indexing rate <span class='ru-sub'>[индэксин рэйт]<\/span>","ru":"скорость индексации"},{"en":"Core Web Vitals","ru":"основные веб-показатели"},{"en":"LCP (Largest Contentful Paint)","ru":"загрузка крупнейшего контента"},{"en":"TTFB (Time to First Byte)","ru":"время до первого байта" раф знаний."}]},{"title":"Entity-Based SEO","phrases":[{"en":"Entity clustering","ru":"кластеризация сущностей"},{"en":"Semantic relevance","ru":"семантическая релевантность"},{"en":"Cosine similarity","ru":"косинусная схожесть"},{"en":"Knowledge Graph","ru":"граф знаний"},{"en":"Topical coverage","ru":"тематическое покрытие"}]},{"title":"AI & Voice Search Optimization","phrases":[{"en":"Voice search ready","ru":"готово для голосового поиска"},{"en":"Featured snippets","ru":"избранные сниппеты"},{"en":"AI-generated answers","ru":"ответы, сгенерированные AI"},{"en":"Conversational queries","ru":"разговорные запросы"}]},{"title":"Вопросы, которые может задать клиент","phrases":[{"en":"What is Generative Engine Optimization (GEO) and how is it different from traditional SEO?","ru":""},{"en":"Why is GEO so important for modern digital marketing?","ru":""},{"en":"How can GEO help my business improve visibility in search engines and get more traffic?","ru":""},{"en":"Which specific AI systems and answer engines does GEO target, and why is this important?","ru":""},{"en":"How does GEO work, and how can we measure the success of our GEO efforts?","ru":""},{"en":"What types of content and strategies are most effective for GEO?","ru":""},{"en":"How can we ensure our content is cited and used as a source in AI systems and answer engines?","ru":""},{"en":"How will GEO impact our existing SEO strategy, and how do we integrate it smoothly?","ru":""},{"en":"What tools and methods can we use to track and analyze our GEO progress?","ru":""},{"en":"How can we ensure our GEO strategy aligns with Google and Bing's guidelines?","ru":""},{"en":"How can we adapt our GEO strategy for different languages and regions?","ru":""},{"en":"What challenges and risks might arise when implementing GEO, and how do we overcome them?","ru":""},{"en":"How can we study competitors' successes in GEO and apply that to our own strategy?","ru":""},{"en":"How can we ensure our GEO strategy is future-proof and resilient to change?","ru":""},{"en":"What is the main goal of Generative Engine Optimization (GEO)?","ru":""},{"en":"How does GEO differ from traditional SEO in terms of content structure?","ru":""},{"en":"What role does semantic analysis play in GEO?","ru":""},{"en":"How do generative search engines evaluate the authority of a website?","ru":""},{"en":"What are the key factors that influence a website's visibility in AI-driven search results?","ru":""},{"en":"What are the best practices for creating content optimized for GEO?","ru":""},{"en":"How can we monitor and measure the effectiveness of our GEO efforts?","ru":""},{"en":"How can we leverage GEO to improve our brand's reputation online?","ru":""}]}],"11":[{"title":"Мягкое уточнение","phrases":[{"en":"Actually (на самом деле / вообще-то)","ru":"It wasn't the update — it was the broken redirect."},{"en":"The thing is, (дело в том, что)","ru":"We can't fix this without dev support."},{"en":"That said, (тем не менее / при этом)","ru":"Traffic dropped. That said, conversions are fine."},{"en":"Here's the thing: (вот в чём дело)","ru":"Rankings are volatile right now."}]},{"title":"Причина и следствие","phrases":[{"en":"So basically, (так что по сути / короче говоря)","ru":"The page is too slow. So basically, users leave."},{"en":"Which means (that) (что означает / а значит)","ru":"We lost snippets, which means CTR dropped."},{"en":"That's why (вот почему / именно поэтому)","ru":"Robots.txt blocked it. That's why it's not indexed."},{"en":"As a result, (в результате)","ru":"We fixed 404s. As a result, crawlability improved."}]},{"title":"Добавление мысли","phrases":[{"en":"Plus, (плюс к этому / ещё)","ru":"We fixed titles. Plus, we improved internal linking."},{"en":"On top of that, (вдобавок к этому / мало того)","ru":"The site is slow. On top of that, it's not mobile-friendly."},{"en":"Also, (также / ещё)","ru":"We also need to check the page experience report."}]},{"title":"Пояснение","phrases":[{"en":"I mean, uo;s easier, we can go through it on a quick call.&rdquo;","ru":"Если так удобнее, можем разобрать это на коротком звонке."}]},{"title":"E. «Это вне объёма»","phrases":[{"en":"&ldquo;That&rsquo;s a great idea, but it&rsquo;s outside the current scope.&rdquo;","ru":"Отличная идея, но она вне текущего объёма."},{"en":"&ldquo;I can send a quick estimate if you&rsquo;d like to add it.&rdquo;","ru":"Могу прислать быструю оценку, если захотите добавить."},{"en":"&ldquo;Let&rsquo;s keep the current plan on track and revisit this next month.&rdquo;","ru":"Давайте выдержим текущий план и вернёмся к этому в следующем месяце."}]}]}}</script>
